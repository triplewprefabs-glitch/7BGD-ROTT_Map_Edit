<title>[7BGD] ROTT Map Edit</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0000aa;--pn:#aaaaaa;--cv:#000;--cell:#101018;--grid:rgba(85,255,255,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#000;color:#fff;font:20px/1.1 "VT323","Perfect DOS VGA 437",Consolas,"Courier New",monospace;-webkit-font-smoothing:none;overflow:hidden;display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;width:min(100vw,calc(100dvh*9/16));background:var(--bg);position:relative;overflow:hidden}
button,select,input{font:inherit;color:inherit;border-radius:0}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:5px 6px;background:var(--pn);color:#000;border-bottom:2px solid #000;flex:none}
.b{background:#aaa;color:#000;border:2px solid;border-color:#fff #555 #555 #fff;padding:2px 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:34px;flex:none}
.b:hover{background:#00aaaa}
.b.on{background:#0000aa;color:#fff;border-color:#555 #fff #fff #555}
.b:focus-visible,select:focus-visible,input:focus-visible{outline:2px dotted #ff0;outline-offset:1px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;shape-rendering:crispEdges;flex:none}
select,#mn,#cd{background:#000;color:#55ffff;border:2px solid;border-color:#555 #fff #fff #555;padding:2px 5px;min-height:34px;box-sizing:border-box}
#brand{flex:1 1 auto;min-width:0;color:#0000aa;font-size:19px;line-height:.95}.tr{display:flex;align-items:center;gap:5px;flex:1 0 100%;min-width:0}#ms{flex:1 1 0;min-width:0}#gm{width:86px;flex:none}#sz{width:92px;flex:none}#vm,#lg{padding:2px 5px}#logo{width:26px;height:26px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;border:2px solid #000}.wb{width:30px;min-height:30px;padding:0!important}.wb:disabled{opacity:.45;cursor:default}.wb:disabled:hover{background:#aaa}#top select{font-size:18px;padding:2px 3px}#pe{flex:none!important;width:38px}#pal.big{flex-basis:72%}#app.land #pal.big{flex-basis:min(56%,540px)}#cd{width:84px;min-height:30px;flex:none}
#menu{position:fixed;z-index:20;background:var(--pn);color:#000;border:3px double #000;min-width:250px;padding:3px;display:none;box-shadow:8px 8px 0 #000}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;cursor:pointer;color:#000}
#menu button:hover{background:#000;color:#fff}
#menu hr{border:0;border-top:2px solid #555;margin:3px 0}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:4px}
#tools{flex:none;display:flex;gap:4px;padding:4px;overflow-x:auto;background:var(--pn);border:3px double #fff}
#tools .b{padding:2px 6px}
#wrap{flex:1;min-height:0;position:relative;background:#000;border:4px double #fff}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;image-rendering:crisp-edges;image-rendering:pixelated}
#pal{flex:0 0 44%;min-height:0;display:flex;flex-direction:column;background:var(--pn);color:#000;border:3px double #fff}
#lt{display:flex;gap:4px;padding:4px}#lt .b{flex:1;min-height:30px;padding:0 4px}
#pv{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:4px 6px;border-block:2px solid #555;flex:none}
#pc{width:34px;height:34px;flex:none;image-rendering:crisp-edges;image-rendering:pixelated;background:#000;border:2px solid;border-color:#555 #fff #fff #555}
#sel{flex:1;min-width:0;word-break:break-word}
#ct{display:flex;gap:4px;flex:1 0 100%}#ct select{min-height:26px;font-size:16px;padding:0 3px;flex:1;min-width:0}
#grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,40px);gap:4px;padding:6px;align-content:start;justify-content:center;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#grid button{width:40px;height:40px;padding:2px;border:2px solid;border-color:#555 #fff #fff #555;background:#000;cursor:pointer}
#grid button.on{border-color:#ffff55;outline:2px solid #000}
#grid canvas{width:32px;height:32px;display:block;image-rendering:crisp-edges;image-rendering:pixelated}
#ov{position:fixed;inset:0;background:rgba(0,0,170,.7);display:none;align-items:center;justify-content:center;z-index:30}
#box{background:var(--pn);color:#000;border:4px double #000;box-shadow:10px 10px 0 #000;padding:14px;width:min(460px,92vw);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#box h2{margin:0;font-size:22px;font-weight:400;background:#000;color:#fff;padding:2px 8px}
#box label{display:flex;flex-direction:column;gap:4px}
#box p{margin:0;color:#222}
#box input[type=file]{background:#fff;border:2px inset #555;padding:4px}
#box .r{display:flex;gap:8px;justify-content:flex-end}
.p{background:#0000aa;color:#fff}
#app.land{width:min(100vw,calc(100dvh*16/9))}
#app.land #main{flex-direction:row}
#app.land #tools{flex-direction:column;overflow-x:visible;overflow-y:auto}
#app.land #wrap{min-width:0}
#app.land #pal{flex:0 0 min(34%,320px)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#ffff55;color:#000;border:2px solid #000;box-shadow:5px 5px 0 #000;padding:4px 12px;display:none;z-index:40;max-width:90vw}
</style>
</head>

<div id="app">
<div id="top">
 <div class="tr"><canvas id="logo" width="16" height="16" aria-hidden="true"></canvas><div id="brand">[7BGD] ROTT Map Edit</div><button class="b" id="vm" data-ti="tView"></button><button class="b" id="lg" data-ti="lang"></button><button class="b wb" id="wmin" data-ti="tMin"></button><button class="b wb" id="wmax" data-ti="tMax"></button></div>
 <div class="tr"><button class="b" id="fb" data-i="file"></button><select id="gm" data-ti="gameT"></select><select id="ms" aria-label="Map"></select><button class="b" id="madd" data-ti="addmapT"></button><select id="sz" data-ti="sizeT"></select></div>
</div>
<div id="main">
 <div id="tools"></div>
 <div id="wrap"><canvas id="cv"></canvas></div>
 <div id="pal">
  <div id="lt"><button class="b" id="pl0" data-i="tabW"></button><button class="b" id="pl1" data-i="tabO"></button><button class="b" id="pl2" data-i="tabS"></button><button class="b" id="pe" data-ti="tExp"></button></div>
  <div id="pv"><canvas id="pc" width="128" height="128"></canvas><div id="sel"></div><input id="cd" size="6" data-ti="codeT" placeholder="0x…"><div id="ct"></div></div>
  <div id="grid"></div>
 </div>
</div>
</div>
<div id="menu">
 <button data-a="new" data-i="new"></button>
 <button data-a="open" data-i="open"></button>
 <button data-a="ren" data-i="ren"></button><hr>
 <button data-a="imp" data-i="imp"></button>
 <button data-a="prop" data-i="props"></button>
 <button data-a="sav" data-i="sav"></button><hr>
 <button data-a="exp" data-i="exp"></button>
</div>
<div id="ov"><div id="box"></div></div>
<div id="toast"></div>
<input type="file" id="fo" multiple hidden>

 let nm='';for(let k=0;k<16;k++){const c=G[o+22+k];if(!c)break;nm+=String.fromCharCode(c)}
 const n=Math.max(w,h,1);return{name:nm,n,p:[0,1,2].map(k=>{const a=new Uint16Array(n*n);if(pl[k]>0&&ps[k]>0){const u=unpack(G,ps[k],tag,w*h,mode);for(let y=0;y<h;y++)for(let x=0;x<w;x++)a[y*n+x]=u[y*w+x]}return a})}}
function scanHeaders(G){const gv=new DataView(G.buffer),r=[];
 for(let p=0;p+38<=G.length;){const a=gv.getInt32(p,true),b=gv.getInt32(p+4,true),c=gv.getInt32(p+8,true),la=gv.getUint16(p+12,true),lb=gv.getUint16(p+14,true),lc=gv.getUint16(p+16,true),w=gv.getUint16(p+18,true),h=gv.getUint16(p+20,true);
  let ok=a>=4&&b>=a+la&&(lc==0||c>=b+lb)&&la>2&&lb>2&&a+la<=G.length&&b+lb<=G.length&&w>=2&&w<=1024&&h>=2&&h<=1024&&G[p+22]>32&&G[p+22]<127;
  for(let k=23;ok&&k<38;k++){const v=G[p+k];if(v&&(v<32||v>126))ok=false}
  if(ok){r.push(p);p+=38}else p++}
 return r}

function openWad(u){const v=new DataView(u.buffer),nl=v.getInt32(4,true),dof=v.getInt32(8,true),maps=[];
 for(let i=0;i<nl;i++){const b=dof+i*16;let ln='';for(let k=0;k<8;k++){const c=u[b+8+k];if(!c)break;ln+=String.fromCharCode(c)}
  const o=v.getInt32(b,true),sz=v.getInt32(b+4,true);if(ln.toUpperCase()!='PLANES'||sz<18)continue;
  const np=v.getUint16(o+10,true),nlen=v.getUint16(o+12,true);let nn='';for(let k=0;k<nlen;k++)nn+=String.fromCharCode(u[o+14+k]);
  const w=v.getUint16(o+14+nlen,true),h=v.getUint16(o+16+nlen,true),n=Math.max(w,h,1),base=o+18+nlen;
  maps.push({name:nn||'MAP',n,p:[0,1,2].map(k=>{const a=new Uint16Array(n*n);if(k<np)for(let y=0;y<h;y++)for(let x=0;x<w;x++)a[y*n+x]=v.getUint16(base+(k*w*h+y*w+x)*2,true);return a})})}
 if(!maps.length)return toast(t('wadNo'));done(maps)}

 if(mh){H=new Uint8Array(await mh.arrayBuffer());const hv=new DataView(H.buffer);tag=hv.getUint16(0,true);for(let i=0;i<100&&2+i*4+4<=H.length;i++){const o=hv.getInt32(2+i*4,true);if(o>0)offs.push(o)}}
 else offs=scanHeaders(G);
 const mode='',maps=[],info=` [${gm.name} ${G.length} B${mh?', '+mh.name+' '+H.length+' B':''}]`;let bad=0,why='';
 for(const o of offs){try{if(o+38>G.length)throw new Error('offset '+o);maps.push(parseMap(G,gv,o,tag,mode))}catch(e){bad++;why=e.message||String(e)}}
